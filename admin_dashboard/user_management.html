<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management – PharmaAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="admin-shared.css"/>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <header class="topbar" id="topbar"></header>

  <div class="content">

    <!-- STATS -->
    <div class="stats-row cols-4">
      <div class="stat-card">
        <div class="label">Total Users</div>
        <div class="value" id="sTotal">—</div>
        <div class="sub">All roles</div>
      </div>
      <div class="stat-card">
        <div class="label">Customers</div>
        <div class="value" style="color:var(--primary)" id="sCustomers">—</div>
        <div class="sub">Registered shoppers</div>
      </div>
      <div class="stat-card">
        <div class="label">Pharmacists</div>
        <div class="value" style="color:var(--accent-green)" id="sPharmacists">—</div>
        <div class="sub">Verified staff</div>
      </div>
      <div class="stat-card">
        <div class="label">Suspended</div>
        <div class="value" style="color:var(--accent-red)" id="sSuspended">—</div>
        <div class="sub">Blocked accounts</div>
      </div>
    </div>

    <!-- TABLE CARD -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fa-solid fa-users" style="color:var(--primary);margin-right:6px;"></i>All Users</h3>
        <div class="filter-row">
          <select id="filterRole" onchange="filterUsers()">
            <option value="">All Roles</option>
            <option value="customer">customer</option>
            <option value="pharmacist">pharmacist</option>
            <!-- <option value="vendor">vendor</option> -->
            <option value="admin">admin</option>
          </select>
          <select id="filterStatus" onchange="filterUsers()">
            <option value="">All Statuses</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="pending">Pending</option>
          </select>
          <input type="text" id="searchUser" placeholder="Search name or email…" oninput="filterUsers()"/>
          <button class="btn btn-primary" onclick="openAddUser()"><i class="fa-solid fa-plus"></i> Add User</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Joined</th>
            <th>Last Active</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userBody"></tbody>
      </table>

      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border);">
        <span style="font-size:0.78rem;color:var(--text-muted);" id="pageInfo">Showing 0 of 0</span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="btn btn-ghost" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD / EDIT USER MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add New User</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input class="form-control" id="fFirstName" placeholder="e.g. Kofi"/>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input class="form-control" id="fLastName" placeholder="e.g. Mensah"/>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-control" id="fEmail" type="email" placeholder="user@example.com"/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input class="form-control" id="fPhone" placeholder="+233 …"/>
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <select class="form-control" id="fRole">
            <option>customer</option>
            <option>pharmacist</option>
            <!-- <option>vendor</option> -->
            <option>admin</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control" id="fStatus">
            <option>active</option>
            <option>pending</option>
            <option>suspended</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()"><i class="fa-solid fa-save"></i> Save User</button>
    </div>
  </div>
</div>

<!-- CONFIRM SUSPEND MODAL -->
<div class="modal-overlay" id="suspendModal">
  <div class="modal" style="width:400px;">
    <div class="modal-header">
      <h3 id="suspendTitle">Suspend User</h3>
      <button class="modal-close" onclick="closeModal('suspendModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <p id="suspendText" style="font-size:0.85rem;color:var(--text-muted);"></p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('suspendModal')">Cancel</button>
      <button class="btn btn-danger" id="suspendConfirmBtn" onclick="confirmSuspend()">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i id="toastIcon" class="fa-solid fa-circle-check" style="color:#4ade80;"></i><span id="toastMsg"></span></div>

<script src="admin-layout.js"></script>
<script>
renderAdminLayout({ activePage: 'user-management', pageTitle: 'User Management' });

/* ── MOCK DATA — replace with fetch('api/admin/users.php') ── */
let USERS = [];
/* TODO: const USERS = await fetch('api/admin/users.php').then(r=>r.json()); */

let filtered=[...USERS], currentPage=1, editingId=null, suspendingId=null;
const PER_PAGE=5;

const roleBadge = role => ({

    customer: "badge-blue",

    pharmacist: "badge-green",

    admin: "badge-red"

}[role] || "badge-gray");
const statusBadge = status => ({

    active: "badge-green",

    blocked: "badge-red",

    pending: "badge-amber"

}[status] || "badge-gray");


async function loadUsers() {

    try {

        const token =
            localStorage.getItem("token") ||
            sessionStorage.getItem("token");

        const response = await fetch(
            "/pharmacy/backend/api/admin/users.php",
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const result = await response.json();

        if (!result.success) {

            showToast(result.message, "error");

            return;

        }

        USERS = result.data.map(user => ({

            id: user.id,

            fn: user.full_name.split(" ")[0],

            ln: user.full_name.split(" ").slice(1).join(" "),

            email: user.email,

            phone: user.phone,

            role: user.role,

            status: user.status,

            joined: new Date(user.created_at).toLocaleDateString(),

            last: "-",

            initials:
                user.full_name
                    .split(" ")
                    .map(x => x[0])
                    .join("")
                    .substring(0,2)
                    .toUpperCase(),

            color: "av-blue"

        }));

        filtered = [...USERS];

        updateStats();

        renderTable();

    }

    catch(error){

        console.error(error);

        showToast("Unable to load users","error");

    }

}
function renderTable() {
  const start=(currentPage-1)*PER_PAGE;
  const page=filtered.slice(start,start+PER_PAGE);
  document.getElementById('userBody').innerHTML = page.map(u=>`
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="avatar ${u.color}">${u.initials}</div>
          <div>
            <div style="font-weight:600;font-size:0.83rem;">${u.fn} ${u.ln}</div>
            <div style="font-size:0.72rem;color:var(--text-muted);">${u.email}</div>
          </div>
        </div>
      </td>
      <td><span class="badge ${roleBadge(u.role)}">${u.role.charAt(0).toUpperCase() + u.role.slice(1)}</span></td>
      <td><span class="badge ${statusBadge(u.status)}">${u.status.charAt(0).toUpperCase() + u.status.slice(1)}</span></td>
      <td style="font-size:0.78rem;">${u.joined}</td>
      <td style="font-size:0.78rem;color:var(--text-muted);">${u.last}</td>
      <td>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-outline" onclick="editUser(${u.id})"><i class="fa-solid fa-pen"></i></button>
          <button class="btn ${u.status==='Suspended'?'btn-success':'btn-danger'}" onclick="openSuspend(${u.id})">
            <i class="fa-solid ${u.status==='Suspended'?'fa-unlock':'fa-ban'}"></i>
          </button>
        </div>
      </td>
    </tr>
  `).join('');
  document.getElementById('pageInfo').textContent=`Showing ${Math.min(start+PER_PAGE,filtered.length)} of ${filtered.length}`;
}

function updateStats() {

    document.getElementById("sTotal").textContent =
        USERS.length;

    document.getElementById("sCustomers").textContent =
        USERS.filter(u => u.role === "customer").length;

    document.getElementById("sPharmacists").textContent =
        USERS.filter(u => u.role === "pharmacist").length;

    document.getElementById("sSuspended").textContent =
        USERS.filter(u => u.status === "blocked").length;

}

function filterUsers() {
  const role=document.getElementById('filterRole').value;
  const status=document.getElementById('filterStatus').value;
  const q=document.getElementById('searchUser').value.toLowerCase();
  filtered=USERS.filter(u=>
    (!role||u.role===role)&&(!status||u.status===status)&&
    (!q||`${u.fn} ${u.ln} ${u.email}`.toLowerCase().includes(q))
  );
  currentPage=1; renderTable();
}

function changePage(d){currentPage+=d;renderTable();}

function openAddUser(){
  editingId=null;
  document.getElementById('modalTitle').textContent='Add New User';
  ['fFirstName','fLastName','fEmail','fPhone'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('userModal').classList.add('open');
}

function editUser(id){
  const u=USERS.find(x=>x.id===id); if(!u)return;
  editingId=id;
  document.getElementById('modalTitle').textContent='Edit User';
  document.getElementById('fFirstName').value=u.fn;
  document.getElementById('fLastName').value=u.ln;
  document.getElementById('fEmail').value=u.email;
  document.getElementById('fPhone').value=u.phone;
  document.getElementById('fRole').value=u.role;
  document.getElementById('fStatus').value=u.status;
  document.getElementById('userModal').classList.add('open');
}

function saveUser(){
  const fn=document.getElementById('fFirstName').value.trim();
  const ln=document.getElementById('fLastName').value.trim();
  const email=document.getElementById('fEmail').value.trim();
  if(!fn||!ln||!email){showToast('Please fill required fields','warn');return;}
  /* TODO: fetch('api/admin/save-user.php',{method:'POST',body:JSON.stringify({...})}) */
  if(editingId){
    const u=USERS.find(x=>x.id===editingId);
    if(u){u.fn=fn;u.ln=ln;u.email=email;u.role=document.getElementById('fRole').value;u.status=document.getElementById('fStatus').value;}
    showToast('User updated successfully');
  } else {
    USERS.push({id:Date.now(),fn,ln,email,phone:document.getElementById('fPhone').value,role:document.getElementById('fRole').value,status:'Active',joined:'Today',last:'Just now',initials:fn[0]+ln[0],color:'av-blue'});
    showToast('User added successfully');
  }
  closeModal(); filtered=[...USERS]; updateStats(); renderTable();
}

function openSuspend(id){
  const u=USERS.find(x=>x.id===id); if(!u)return;
  suspendingId=id;
  const action=u.status==='Suspended'?'Reactivate':'Suspend';
  document.getElementById('suspendTitle').textContent=`${action} User`;
  document.getElementById('suspendText').textContent=`Are you sure you want to ${action.toLowerCase()} ${u.fn} ${u.ln}?`;
  document.getElementById('suspendConfirmBtn').textContent=action;
  document.getElementById('suspendConfirmBtn').className=`btn ${action==='Suspend'?'btn-danger':'btn-success'}`;
  document.getElementById('suspendModal').classList.add('open');
}

function confirmSuspend(){
  const u=USERS.find(x=>x.id===suspendingId); if(!u)return;
  u.status=u.status==='Suspended'?'Active':'Suspended';
  /* TODO: fetch('api/admin/suspend-user.php',{method:'POST',body:JSON.stringify({id:suspendingId,status:u.status})}) */
  closeModal('suspendModal'); filtered=[...USERS]; updateStats(); renderTable();
  showToast(`User ${u.status==='Suspended'?'suspended':'reactivated'}`,'warn');
}

function closeModal(id='userModal'){document.getElementById(id).classList.remove('open');}

loadUsers();
</script>
</body>
</html>
